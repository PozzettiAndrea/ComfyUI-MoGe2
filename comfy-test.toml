# MoGe-2 is a DINOv2-ViT model with no custom CUDA kernels, so it CAN technically
# run on CPU. In practice even the smallest variant (vits-normal, 35M params) is
# painfully slow on CPU at the default resolution_level (~minutes/image), and the
# default loader picks vitl-normal (~1.2 GB). For CI we test GPU only.

[test]
levels = ["syntax", "install", "registration", "instantiation", "execution"]

[test.workflows]
cpu = []
gpu = "all"

[test.platforms]
linux = true
macos = true
windows = true
windows_portable = true
linux_gpu = true
windows_gpu = true
windows_portable_gpu = true
macos_desktop = true
windows_desktop = true
windows_desktop_gpu = true
